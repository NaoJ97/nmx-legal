<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ NaoMiX — NMX Productions</title>
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --ink-muted:#5B6472;
    --accent:#3454D1;
    --accent-soft:#EAEEFC;
    --border:#E2E5EA;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1319;
      --surface:#171D26;
      --ink:#E7EAEF;
      --ink-muted:#9AA3B2;
      --accent:#7C97FF;
      --accent-soft:#1C2438;
      --border:#262E3A;
    }
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.65;
    padding-inline:20px;
    padding-block:48px;
    margin:0;
  }
  .doc{
    max-width:700px;
    margin-inline:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:40px 36px 48px;
  }
  @media (max-width:520px){ .doc{padding:28px 20px 36px} }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;
    flex-shrink:0;
  }
  .brand .name{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  h1{
    font-family:'Newsreader', Georgia, serif;
    font-weight:600;
    font-size:clamp(28px,5vw,36px);
    line-height:1.15;
    margin:0 0 10px;
  }
  .intro{ color:var(--ink-muted); font-size:15.5px; margin-bottom:30px; }
  .links{ display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .links a{
    display:block;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--ink);
    text-decoration:none;
    font-size:15px;
  }
  .links a:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .links a span{ color:var(--accent); font-family:var(--mono); font-size:12.5px; display:block; margin-bottom:2px; }
  footer{
    margin-top:36px;
    padding-top:20px;
    border-top:1px solid var(--border);
    font-size:13px;
    color:var(--ink-muted);
  }
  footer a{ color:var(--accent); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="doc">
  <div class="brand">
    <div class="mark">N</div>
    <div class="name">NMX Productions</div>
  </div>

  <h1>DJ NaoMiX</h1>
  <p class="intro">Independent music producer, artist and label — NMX Productions / NMX Music.</p>

  <div class="links">
    <a href="https://youtube.com/@naojl"><span>YouTube</span>@naojl — DJ NaoMiX official channel</a>
    <a href="https://www.tiktok.com/@naojl"><span>TikTok</span>@naojl</a>
    <a href="terms.html"><span>Legal</span>Terms of Service</a>
    <a href="privacy.html"><span>Legal</span>Privacy Policy</a>
  </div>

  <footer>
    NMX Productions · Contact: <a href="mailto:nmxmusicpro@gmail.com">nmxmusicpro@gmail.com</a>
  </footer>
</div>
</body>
</html>
